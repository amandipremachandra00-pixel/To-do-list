<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-primary px-4 shadow-sm">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1 fw-bold">My To Do List</span>
        </div>
    </nav>

    <!-- Main Container Card Wrap -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <div class="card border-0 shadow-sm p-4 rounded-4">
                    <div class="card-body">

                        <!-- Heading -->
                        <div class="text-center mb-4">
                            <h2 class="fw-bold text-dark">Task Manager</h2>
                            <p class="text-muted small">Organize your tasks and stay productive.</p>
                        </div>

                        <!-- Task Input Field & Add Task Button -->
                        <div class="input-group mb-4">
                            <input type="text" id="taskInput" class="form-control form-control-lg fs-6" placeholder="Enter a new task...">
                            <button id="addTaskBtn" class="btn btn-primary px-4 fw-semibold" type="button">Add Task</button>
                        </div>

                        <!-- Task Counter Header -->
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="text-secondary fw-medium small">Your tasks</span>
                            <span id="taskCounter" class="badge bg-primary rounded-pill px-3 py-2 fw-normal">0 remaining</span>
                        </div>

                        <!-- Filter Buttons -->
                        <div class="btn-group w-100 mb-4" role="group" aria-label="Filter buttons">
                            <button type="button" class="btn btn-primary">All</button>
                            <button type="button" class="btn btn-outline-primary">Active</button>
                            <button type="button" class="btn btn-outline-primary">Completed</button>
                        </div>

                        <!-- Task List Container -->
                        <div id="taskList" class="mb-3">
                            <div id="emptyState" class="text-center py-4">
                                <p class="text-muted small mb-0">No tasks yet. Add your first task!</p>
                            </div>
                        </div>

                        <!-- Clear Completed Button -->
                        <div class="d-flex justify-content-end">
                            <button type="button" class="btn btn-outline-danger btn-sm px-3 fw-medium">Clear Completed</button>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JavaScript File -->
    <script src="script.js"></script>
</body>
</html>
